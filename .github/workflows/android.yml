name: Build RELEASE APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install
        run: npm install --legacy-peer-deps
        
      - name: Prebuild
        run: npx expo prebuild --platform android --clean --no-install

      - name: Create Keystore for Release
        working-directory: android
        run: |
          keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass tarzan123 -keypass tarzan123 -dname "CN=TARZAN, OU=App, O=TARZAN, L=Raipur, S=CG, C=IN" -alias tarzan
          echo "STORE_FILE=release.jks" > keystore.properties
          echo "STORE_PASSWORD=tarzan123" >> keystore.properties
          echo "KEY_ALIAS=tarzan" >> keystore.properties
          echo "KEY_PASSWORD=tarzan123" >> keystore.properties
          echo "android { signingConfigs { release { storeFile file('release.jks'); storePassword 'tarzan123'; keyAlias 'tarzan'; keyPassword 'tarzan123' } } buildTypes { release { signingConfig signingConfigs.release } } }" > app/build-signing.gradle
          echo "apply from: 'build-signing.gradle'" >> app/build.gradle

      - name: Build RELEASE APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: TARZAN-KATLAM-RELEASE-APK-FINAL
          path: android/app/build/outputs/apk/release/app-release.apk
