name: Build RELEASE APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install
        run: npm install --legacy-peer-deps
        
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Create Keystore
        working-directory: android
        run: |
          keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass tarzan123 -keypass tarzan123 -dname "CN=TARZAN, OU=App, O=TARZAN, L=Raipur, S=CG, C=IN" -alias tarzan
          echo "MYAPP_RELEASE_STORE_FILE=release.jks" > app/keystore.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=tarzan" >> app/keystore.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=tarzan123" >> app/keystore.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=tarzan123" >> app/keystore.properties
          echo "STORE_FILE=release.jks" >> app/keystore.properties
          echo "STORE_PASSWORD=tarzan123" >> app/keystore.properties
          echo "KEY_ALIAS=tarzan" >> app/keystore.properties
          echo "KEY_PASSWORD=tarzan123" >> app/keystore.properties
          ls -lh app/

      - name: Build RELEASE APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: TARZAN-KATLAM-RELEASE-FINAL
          path: android/app/build/outputs/apk/release/app-release.apk
